name: CMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The team develops on both macOS and Windows; Linux matches most servers.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -rfE --tb=short 2>&1 | tee pytest-output.txt

      - name: List failed tests on the pull request
        if: failure()
        shell: bash
        run: |
          # Each failed test becomes an annotation on the PR's "Files changed" / Checks tab.
          grep -E "^(FAILED|ERROR) " pytest-output.txt | sed 's/^/::error title=Test failed::/' || true
