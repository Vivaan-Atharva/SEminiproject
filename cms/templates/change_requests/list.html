{% extends "base.html" %}

{% block title %}Change requests · CMS{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Change requests</h1>
    <a class="btn btn-primary" href="{{ url_for('change_requests.new') }}">New request</a>
  </div>

  <form method="get" class="card card-body mb-4">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="q">Search</label>
        <input class="form-control" id="q" name="q" value="{{ filters.q }}" placeholder="Title or CR number">
      </div>
      <div class="col-md-2">
        <label class="form-label" for="status">Status</label>
        <select class="form-select" id="status" name="status">
          <option value="">All statuses</option>
          {% for value in statuses %}<option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ value }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="priority">Priority</label>
        <select class="form-select" id="priority" name="priority">
          <option value="">All priorities</option>
          {% for value in priorities %}<option value="{{ value }}" {% if filters.priority == value %}selected{% endif %}>{{ value }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="component">Component</label>
        <select class="form-select" id="component" name="component">
          <option value="">All components</option>
          {% for value in components %}<option value="{{ value }}" {% if filters.component == value %}selected{% endif %}>{{ value }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label" for="sort">Sort</label>
        <select class="form-select" id="sort" name="sort">
          <option value="newest" {% if filters.sort == 'newest' %}selected{% endif %}>Newest</option>
          <option value="oldest" {% if filters.sort == 'oldest' %}selected{% endif %}>Oldest</option>
          <option value="priority" {% if filters.sort == 'priority' %}selected{% endif %}>Priority</option>
        </select>
      </div>
    </div>
    <div class="mt-3"><button class="btn btn-outline-primary" type="submit">Apply filters</button></div>
  </form>

  {% with test_id='change-requests', empty='No change requests found', show_due=false %}
    {% include "_cr_table.html" %}
  {% endwith %}
{% endblock %}
